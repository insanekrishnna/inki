<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:;">
  <title>Your Project</title>
  <link rel="icon" type="image/png" href="inki.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="canvas-container" id="canvas-container">
    <div class="editor-drag-region" aria-hidden="true"></div>
    <div class="toolbar liquidGlass-wrapper">
      <div class="toolbar-dismiss-hint" aria-hidden="true"></div>
      <div class="liquidGlass-effect" aria-hidden="true"></div>
      <div class="liquidGlass-tint" aria-hidden="true"></div>
      <div class="liquidGlass-shine" aria-hidden="true"></div>
      <div class="toolbar-brand" aria-label="INKI">
        <img src="inki.png" alt="INKI" class="toolbar-logo">
      </div>
      <div class="toolbar-group capture-modes">
        <button class="toolbar-btn" id="btn-capture-region" data-tooltip="Capture region"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8V4h4"/><path d="M4 16v4h4"/><path d="M16 4h4v4"/><path d="M16 20h4v-4"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-dasharray="2 2"/></svg></button>
        <button class="toolbar-btn" id="btn-capture-window" data-tooltip="Capture window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/><circle cx="5.5" cy="6" r=".5" fill="currentColor"/><circle cx="7.5" cy="6" r=".5" fill="currentColor"/><circle cx="9.5" cy="6" r=".5" fill="currentColor"/></svg></button>
        <button class="toolbar-btn" id="btn-capture-fullscreen" data-tooltip="Capture fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 21h12"/><path d="M12 17v4"/></svg></button>
      </div>
      <div class="theme-toggle-group inline-flex items-center gap-2" id="theme-toggle-group">
        <span id="theme-light" class="theme-toggle-icon theme-toggle-icon-light cursor-pointer text-left text-sm font-medium" aria-controls="btn-toggle-theme" onclick="if(document.body.classList.contains('theme-dark')) document.getElementById('btn-toggle-theme').click()">
          <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </span>
        <button class="theme-toggle" id="btn-toggle-theme" type="button" role="switch" aria-checked="false" aria-labelledby="theme-dark theme-light" aria-label="Toggle between dark and light mode">
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
          </span>
        </button>
        <span id="theme-dark" class="theme-toggle-icon theme-toggle-icon-dark cursor-pointer text-right text-sm font-medium" aria-controls="btn-toggle-theme" onclick="if(!document.body.classList.contains('theme-dark')) document.getElementById('btn-toggle-theme').click()">
          <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </span>
      </div>
      <div class="toolbar-group tools">
        <button class="toolbar-btn tool-btn" data-tool="select" data-tooltip="Select / Move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4l6 15 2-6 6-2z"/></svg></button>
        <button class="toolbar-btn tool-btn" data-tool="rect" data-tooltip="Rectangle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
        <button class="toolbar-btn tool-btn" data-tool="ellipse" data-tooltip="Ellipse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
        <button class="toolbar-btn tool-btn" data-tool="arrow" data-tooltip="Arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 19L19 5"/><path d="M14 5h5v5"/></svg></button>
        <button class="toolbar-btn tool-btn" data-tool="line" data-tooltip="Line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 19L19 5"/></svg></button>
        <button class="toolbar-btn tool-btn" data-tool="text" data-tooltip="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h12"/><path d="M12 6v12"/><path d="M8 18h8"/></svg></button>
        <button class="toolbar-btn tool-btn" data-tool="pixelate" data-tooltip="Pixelate sensitive data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        <button class="toolbar-btn tool-btn" data-tool="magic-wand" data-tooltip="Magic Wand (remove background)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/><path d="M20 20l-4-4"/></svg></button>
      </div>
      <div class="toolbar-separator text-style-separator" id="text-style-separator"></div>
      <div class="toolbar-group text-style-group" id="text-style-group">
        <div class="font-picker" id="font-picker">
          <button type="button" class="font-current" id="font-current" aria-label="Font family" aria-haspopup="true" aria-expanded="false">
            <span class="font-current-label" id="font-current-label">System</span>
            <svg class="font-current-chevron" viewBox="0 0 8 5" width="8" height="5" fill="none" aria-hidden="true"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="font-menu" id="font-menu" role="menu" aria-label="Font family" aria-hidden="true">
            <button type="button" class="font-option" data-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="menuitem" tabindex="-1" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">System</button>
            <button type="button" class="font-option" data-family="'SF Pro', -apple-system, sans-serif" role="menuitem" tabindex="-1" style="font-family: 'SF Pro', -apple-system, sans-serif">SF Pro</button>
            <button type="button" class="font-option" data-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="menuitem" tabindex="-1" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica</button>
            <button type="button" class="font-option" data-family="'Times New Roman', Times, serif" role="menuitem" tabindex="-1" style="font-family: 'Times New Roman', Times, serif">Times New Roman</button>
            <button type="button" class="font-option" data-family="'Courier New', Courier, monospace" role="menuitem" tabindex="-1" style="font-family: 'Courier New', Courier, monospace">Courier New</button>
            <button type="button" class="font-option" data-family="Georgia, serif" role="menuitem" tabindex="-1" style="font-family: Georgia, serif">Georgia</button>
            <button type="button" class="font-option" data-family="'Avenir Next', Avenir, sans-serif" role="menuitem" tabindex="-1" style="font-family: 'Avenir Next', Avenir, sans-serif">Avenir</button>
          </div>
        </div>
        <div class="size-picker" id="size-picker">
          <button type="button" class="size-current" id="size-current" aria-label="Font size" aria-haspopup="true" aria-expanded="false">
            <span class="size-current-label" id="size-current-label">24</span>
            <svg class="size-current-chevron" viewBox="0 0 8 5" width="8" height="5" fill="none" aria-hidden="true"><path d="M1 1l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="size-menu" id="size-menu" role="menu" aria-label="Font size" aria-hidden="true">
            <button type="button" class="size-option" data-size="12" role="menuitem" tabindex="-1">12</button>
            <button type="button" class="size-option" data-size="14" role="menuitem" tabindex="-1">14</button>
            <button type="button" class="size-option" data-size="16" role="menuitem" tabindex="-1">16</button>
            <button type="button" class="size-option" data-size="18" role="menuitem" tabindex="-1">18</button>
            <button type="button" class="size-option" data-size="20" role="menuitem" tabindex="-1">20</button>
            <button type="button" class="size-option" data-size="24" role="menuitem" tabindex="-1">24</button>
            <button type="button" class="size-option" data-size="28" role="menuitem" tabindex="-1">28</button>
            <button type="button" class="size-option" data-size="32" role="menuitem" tabindex="-1">32</button>
            <button type="button" class="size-option" data-size="36" role="menuitem" tabindex="-1">36</button>
            <button type="button" class="size-option" data-size="48" role="menuitem" tabindex="-1">48</button>
            <button type="button" class="size-option" data-size="64" role="menuitem" tabindex="-1">64</button>
            <button type="button" class="size-option" data-size="72" role="menuitem" tabindex="-1">72</button>
          </div>
        </div>
        <button class="toolbar-btn style-btn style-btn--bold" data-style="bold" id="text-style-bold" data-tooltip="Bold" aria-label="Bold" aria-pressed="false"><strong>B</strong></button>
        <button class="toolbar-btn style-btn style-btn--italic" data-style="italic" id="text-style-italic" data-tooltip="Italic" aria-label="Italic" aria-pressed="false"><em>I</em></button>
      </div>
      <div class="toolbar-separator"></div>
      <div class="toolbar-group colors">
        <button class="color-swatch" data-color="#f97316" style="--swatch-color:#f97316"></button>
        <button class="color-swatch" data-color="#ef4444" style="--swatch-color:#ef4444"></button>
        <button class="color-swatch" data-color="#22c55e" style="--swatch-color:#22c55e"></button>
        <button class="color-swatch" data-color="#3b82f6" style="--swatch-color:#3b82f6"></button>
        <button class="color-swatch" data-color="#a855f7" style="--swatch-color:#a855f7"></button>
        <button class="color-swatch black" data-color="#111111" style="--swatch-color:#111111"></button>
      </div>
      <div class="toolbar-separator"></div>
      <div class="toolbar-group strokes">
        <div class="stroke-picker" id="stroke-picker">
          <button class="stroke-current" id="stroke-current" aria-label="Line weight" aria-haspopup="true" aria-expanded="false">
            <span class="stroke-current-icon">
              <span class="stroke-current-line" id="stroke-current-line" style="height:3px"></span>
            </span>
          </button>
          <div class="stroke-menu" id="stroke-menu" role="menu" aria-label="Line weight" aria-hidden="true">
            <button class="stroke-option" data-width="2" role="menuitem" tabindex="-1" aria-label="Thin">
              <span class="stroke-option-line" style="height:1.5px"></span>
            </button>
            <button class="stroke-option" data-width="4" role="menuitem" tabindex="-1" aria-label="Regular">
              <span class="stroke-option-line" style="height:3px"></span>
            </button>
            <button class="stroke-option" data-width="8" role="menuitem" tabindex="-1" aria-label="Bold">
              <span class="stroke-option-line" style="height:5.5px"></span>
            </button>
          </div>
        </div>
      </div>
      <div class="toolbar-group">
        <button class="toolbar-btn" id="btn-crop" data-tooltip="Crop image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2v4H2"/><path d="M6 6h12v12"/><path d="M18 22v-4h4"/><path d="M2 6h4v12h12"/></svg></button>
        <button class="toolbar-btn" id="btn-copy" data-tooltip="Copy to clipboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg></button>
      </div>
      <div class="toolbar-separator"></div>
      <div class="toolbar-group">
        <button class="toolbar-btn" id="btn-undo" data-tooltip="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10h13a4 4 0 010 8H7"/><path d="M7 6L3 10l4 4"/></svg></button>
        <button class="toolbar-btn" id="btn-redo" data-tooltip="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10H8a4 4 0 000 8h9"/><path d="M17 6l4 4-4 4"/></svg></button>
        <button class="toolbar-btn" id="btn-clear" data-tooltip="Clear canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6v14a2 2 0 002 2h10a2 2 0 002-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
      </div>
    </div>

    <!-- Crop overlay UI -->
    <div class="crop-overlay" id="crop-overlay">
      <div class="crop-mask" id="crop-mask"></div>
      <div class="crop-box" id="crop-box">
        <div class="crop-handle crop-handle-n" data-handle="n"></div>
        <div class="crop-handle crop-handle-s" data-handle="s"></div>
        <div class="crop-handle crop-handle-e" data-handle="e"></div>
        <div class="crop-handle crop-handle-w" data-handle="w"></div>
        <div class="crop-handle crop-handle-nw" data-handle="nw"></div>
        <div class="crop-handle crop-handle-ne" data-handle="ne"></div>
        <div class="crop-handle crop-handle-sw" data-handle="sw"></div>
        <div class="crop-handle crop-handle-se" data-handle="se"></div>
      </div>
      <div class="crop-hint" id="crop-hint"><kbd>Enter</kbd> to crop &middot; <kbd>Esc</kbd> to cancel</div>
    </div>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <h2>No image loaded</h2>
      <p>Capture your screen or open an image to begin</p>
      <div class="empty-actions">
        <button class="btn btn-primary" id="empty-capture"><span class="camera-dot"></span>Capture screen</button>
        <button class="btn btn-secondary" id="empty-open">Open image</button>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="text-input-wrapper" id="text-input-wrapper">
      <textarea id="inline-text-input" placeholder="Type here..."></textarea>
    </div>
  </div>

  <div class="statusbar">
    <span class="status-tool" id="status-tool">Ready</span>
    <div class="statusbar-spacer"></div>
    <span class="zoom-level" id="status-zoom">100%</span>
  </div>

  <div class="context-menu" id="context-menu">
    <button class="context-menu-item" id="ctx-window-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r="1" fill="#ff5f57" stroke="none"/><circle cx="9.5" cy="6.5" r="1" fill="#febc2e" stroke="none"/><circle cx="12.5" cy="6.5" r="1" fill="#28c840" stroke="none"/></svg>
      <span>Window container</span>
      <span class="ctx-shortcut">W</span>
    </button>
    <div class="context-menu-separator"></div>
    <div class="context-menu-label">Background</div>
    <div class="context-menu-gradients" id="ctx-gradients">
      <button class="gradient-swatch" data-gradient="none" title="Landing page"><span style="background:linear-gradient(180deg,#dfc8ac,#d7bea2 60%,#cfb18f)"></span></button>
      <button class="gradient-swatch" data-gradient="sunset" title="Sunset"><span style="background:linear-gradient(135deg,#f97316,#ec4899)"></span></button>
      <button class="gradient-swatch" data-gradient="ocean" title="Ocean"><span style="background:linear-gradient(135deg,#06b6d4,#3b82f6)"></span></button>
      <button class="gradient-swatch" data-gradient="forest" title="Forest"><span style="background:linear-gradient(135deg,#22c55e,#14b8a6)"></span></button>
      <button class="gradient-swatch" data-gradient="purple" title="Purple"><span style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"></span></button>
      <button class="gradient-swatch" data-gradient="midnight" title="Midnight"><span style="background:linear-gradient(135deg,#1e1b4b,#312e81)"></span></button>
      <button class="gradient-swatch" data-gradient="warm" title="Warm"><span style="background:linear-gradient(135deg,#fbbf24,#f97316)"></span></button>
    </div>
    <div class="context-menu-separator"></div>
    <button class="context-menu-item" id="ctx-copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>
      <span>Copy to clipboard</span>
      <span class="ctx-shortcut">Ctrl+C</span>
    </button>
    <button class="context-menu-item" id="ctx-save-png">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M3 17v2a2 2 0 002 2h14a2 2 0 002-2v-2"/></svg>
      <span>Save as PNG</span>
      <span class="ctx-shortcut">Ctrl+E</span>
    </button>
  </div>
  <div class="right-sidebar" id="right-sidebar">
    <button class="rs-close-btn" id="rs-close-btn" title="Close sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button class="rs-item" id="rs-window-container" title="Window container (W)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r="1" fill="#ff5f57" stroke="none"/><circle cx="9.5" cy="6.5" r="1" fill="#febc2e" stroke="none"/><circle cx="12.5" cy="6.5" r="1" fill="#28c840" stroke="none"/></svg>
      <span class="rs-label">Window container</span>
    </button>
    <div class="rs-aspect-ratio-wrapper" title="Aspect Ratio">
      <span class="rs-aspect-ratio-label">Aspect ratio</span>
      <div class="rs-custom-select" id="rs-aspect-select">
        <div class="rs-select-value">
          <span id="rs-aspect-value-text">Native</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="rs-select-options">
          <div class="rs-select-option active" data-value="native">Native</div>
          <div class="rs-select-option" data-value="21:9">21:9</div>
          <div class="rs-select-option" data-value="16:9">16:9</div>
          <div class="rs-select-option" data-value="16:10">16:10</div>
          <div class="rs-select-option" data-value="3:2">3:2</div>
          <div class="rs-select-option" data-value="4:3">4:3</div>
          <div class="rs-select-option" data-value="1:1">1:1</div>
          <div class="rs-select-option" data-value="3:4">3:4</div>
          <div class="rs-select-option" data-value="2:3">2:3</div>
          <div class="rs-select-option" data-value="10:16">10:16</div>
          <div class="rs-select-option" data-value="9:16">9:16</div>
        </div>
      </div>
    </div>
    <div class="rs-separator"></div>
    <div class="rs-section-title">FRAME THEME</div>
    <div class="rs-frame-themes" id="rs-frame-themes">
      <button class="rs-frame-swatch active" data-theme="default" title="Default Beige">
        <span style="background: linear-gradient(to bottom, #e4ceb4 50%, #d7bea2 50%);"></span>
      </button>
      <button class="rs-frame-swatch" data-theme="dark" title="macOS Dark">
        <span style="background: linear-gradient(to bottom, #3a3a3c 50%, #1e1e1e 50%);"></span>
      </button>
      <button class="rs-frame-swatch" data-theme="light" title="macOS Light">
        <span style="background: linear-gradient(to bottom, #e5e5e5 50%, #ffffff 50%);"></span>
      </button>
      <button class="rs-frame-swatch" data-theme="midnight" title="Midnight">
        <span style="background: linear-gradient(to bottom, #1e293b 50%, #0f172a 50%);"></span>
      </button>
      <button class="rs-frame-swatch" data-theme="slate" title="Slate">
        <span style="background: linear-gradient(to bottom, #475569 50%, #334155 50%);"></span>
      </button>
      <button class="rs-frame-swatch" data-theme="minimal" title="Minimal White">
        <span style="background: linear-gradient(to bottom, #f8f9fa 50%, #ffffff 50%);"></span>
      </button>
      <button class="rs-frame-swatch" data-theme="glass" title="Glass Dark">
        <span style="background: linear-gradient(to bottom, #404040 50%, #202020 50%);"></span>
      </button>
      <button class="rs-frame-swatch" data-theme="contrast" title="High Contrast">
        <span style="background: linear-gradient(to bottom, #111111 50%, #000000 50%); border: 1px solid rgba(255,255,255,0.1);"></span>
      </button>
    </div>
    <div class="rs-separator"></div>
    <div class="rs-section-title">COLORS</div>
    <div class="rs-gradients" id="rs-gradients">
      <button class="rs-gradient-swatch" data-gradient="none" title="Landing page"><span style="background:linear-gradient(180deg,#dfc8ac,#d7bea2 60%,#cfb18f)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="sunset" title="Sunset"><span style="background:linear-gradient(135deg,#f97316,#ec4899)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="ocean" title="Ocean"><span style="background:linear-gradient(135deg,#06b6d4,#3b82f6)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="forest" title="Forest"><span style="background:linear-gradient(135deg,#22c55e,#14b8a6)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="purple" title="Purple"><span style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"></span></button>
