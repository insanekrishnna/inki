<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>Preferences</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="preferences-window">
  <form class="preferences-panel" id="preferences-form" aria-label="Preferences">
    <div class="preferences-titlebar" aria-hidden="true"></div>

    <header class="preferences-header">
      <div>
        <h1>Settings</h1>
        <p>Your Project</p>
      </div>
    </header>

    <nav class="preferences-tabs" aria-label="Settings sections">
      <button type="button" class="active" data-preferences-tab="general" aria-selected="true">General</button>
      <button type="button" data-preferences-tab="capture" aria-selected="false">Capture</button>
      <button type="button" data-preferences-tab="license" aria-selected="false">License</button>
    </nav>

    <main class="preferences-content">
      <section class="preferences-section active" data-preferences-section="general" aria-label="General">
        <div class="preferences-group" aria-label="General">
          <label class="odometer-row">
            <span class="preferences-copy">
              <span class="preference-title">Auto-hide toolbar</span>
              <span class="preference-description">Delay before hiding the capture toolbar.</span>
            </span>
            <span class="odometer-control" role="group" aria-label="Auto-hide toolbar delay">
              <button type="button" class="odometer-button" id="auto-hide-delay-decrement" aria-label="Decrease auto-hide delay">−</button>
              <input type="hidden" id="auto-hide-delay-setting" value="0">
              <output class="odometer-value" id="auto-hide-delay-setting-value" for="auto-hide-delay-setting" aria-live="polite">
                <span class="odometer-digit">0.5s</span>
              </output>
              <button type="button" class="odometer-button" id="auto-hide-delay-increment" aria-label="Increase auto-hide delay">+</button>
            </span>
          </label>
        </div>

        <div class="preferences-group preferences-field preferences-field--path" aria-label="Saving">
          <div class="preferences-copy">
            <label for="default-save-path-setting">Default save path</label>
            <p>Choose the folder used first when saving screenshots.</p>
          </div>
          <div class="path-picker">
            <input type="text" id="default-save-path-setting" placeholder="System default" readonly>
            <div class="path-picker-actions">
              <button type="button" id="choose-default-save-path-setting">Choose</button>
              <button type="button" id="clear-default-save-path-setting" class="secondary">Clear</button>
            </div>
          </div>
        </div>

      </section>

      <section class="preferences-section" data-preferences-section="capture" aria-label="Capture">
        <div class="preferences-group" aria-label="Capture">
          <label>
            <span class="preferences-copy">
              <span class="preference-title">Hide desktop icons</span>
              <span class="preference-description">Keep the desktop clean while capturing.</span>
            </span>
            <input type="checkbox" id="hide-desktop-icons-setting" checked>
          </label>
          <label>
            <span class="preferences-copy">
              <span class="preference-title">Capture Your Project</span>
              <span class="preference-description">Include the app interface in captures.</span>
            </span>
            <input type="checkbox" id="capture-project-setting">
          </label>
        </div>
      </section>

      <section class="preferences-section" data-preferences-section="license" aria-label="License">
        <div class="preferences-group preferences-field preferences-field--license" aria-label="License">
          <div class="preferences-copy">
            <label>License</label>
            <p id="license-status-setting">Checking license status...</p>
          </div>
          <div class="license-settings-active" id="license-active-state" hidden>
            <div class="license-active-header">
              <img class="license-active-icon" src="../assets/icons/macos/256x256.png" alt="">
              <div class="license-active-owner">
                <span class="license-active-email" id="license-active-email"></span>
                <span class="license-active-thanks">Thank you for your support!</span>
              </div>
            </div>
            <div class="license-active-table">
              <div class="license-row">
                <span class="license-row-label">Plan</span>
                <span class="license-row-value">Lifetime access</span>
              </div>
              <div class="license-row">
                <span class="license-row-label">Purchased</span>
                <span class="license-row-value" id="license-purchased-at"></span>
              </div>
              <div class="license-row">
                <span class="license-row-label">License key</span>
                <span class="license-row-value" id="license-key-display"></span>
              </div>
              <div class="license-row">
                <span class="license-row-label">Devices</span>
                <span class="license-row-value" id="license-devices-display"></span>
              </div>
            </div>
            <button type="button" class="license-deactivate-btn" id="license-deactivate-btn">Deactivate this device</button>
          </div>
          <div class="license-settings-activation" id="license-activation-form">
            <input type="email" id="license-email-setting" placeholder="you@example.com" autocomplete="email">
            <div class="license-settings-actions">
              <button type="button" id="activate-license-setting">Activate</button>
              <button type="button" id="buy-license-setting" class="secondary">Buy license</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </form>

  <script src="preferences.js"></script>
</body>
</html>
