<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:;">
  <title>Your Project</title>
  <link rel="icon" type="image/png" href="inki.png">
  <link rel="stylesheet" href="/src/renderer/styles.css">
</head>
<body>
  <div class="toolbar liquidGlass-wrapper">
    <div class="toolbar-dismiss-hint" aria-hidden="true"></div>
    <div class="liquidGlass-effect" aria-hidden="true"></div>
    <div class="liquidGlass-tint" aria-hidden="true"></div>
    <div class="liquidGlass-shine" aria-hidden="true"></div>
    <div class="toolbar-brand" aria-label="INKI">
      <img src="inki.png" alt="INKI" class="toolbar-logo">
    </div>
    <div class="toolbar-group capture-modes">
      <button class="toolbar-btn" id="btn-capture-region" data-tooltip="Capture region"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8V4h4"/><path d="M4 16v4h4"/><path d="M16 4h4v4"/><path d="M16 20h4v-4"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-dasharray="2 2"/></svg></button>
      <button class="toolbar-btn" id="btn-capture-window" data-tooltip="Capture window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/><circle cx="5.5" cy="6" r=".5" fill="currentColor"/><circle cx="7.5" cy="6" r=".5" fill="currentColor"/><circle cx="9.5" cy="6" r=".5" fill="currentColor"/></svg></button>
      <button class="toolbar-btn" id="btn-capture-fullscreen" data-tooltip="Capture fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 21h12"/><path d="M12 17v4"/></svg></button>
    </div>
    <div id="react-theme-toggle-root"></div>
  </div>

  <div id="editor-sidebar-root"></div>
  <div class="editor-main">
    <div class="canvas-container" id="canvas-container">
      <div class="editor-drag-region" aria-hidden="true"></div>

    <!-- Crop overlay UI -->
    <div class="crop-overlay" id="crop-overlay">
      <div class="crop-mask" id="crop-mask"></div>
      <div class="crop-box" id="crop-box">
        <div class="crop-handle crop-handle-n" data-handle="n"></div>
        <div class="crop-handle crop-handle-s" data-handle="s"></div>
        <div class="crop-handle crop-handle-e" data-handle="e"></div>
        <div class="crop-handle crop-handle-w" data-handle="w"></div>
        <div class="crop-handle crop-handle-nw" data-handle="nw"></div>
        <div class="crop-handle crop-handle-ne" data-handle="ne"></div>
        <div class="crop-handle crop-handle-sw" data-handle="sw"></div>
        <div class="crop-handle crop-handle-se" data-handle="se"></div>
      </div>
      <div class="crop-hint" id="crop-hint"><kbd>Enter</kbd> to crop &middot; <kbd>Esc</kbd> to cancel</div>
    </div>

    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <h2>No image loaded</h2>
      <p>Capture your screen or open an image to begin</p>
      <div class="empty-actions">
        <button class="btn btn-primary" id="empty-capture"><span class="camera-dot"></span>Capture screen</button>
        <button class="btn btn-secondary" id="empty-open">Open image</button>
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="text-input-wrapper" id="text-input-wrapper">
      <textarea id="inline-text-input" placeholder="Type here..."></textarea>
    </div>
  </div>

    <div class="statusbar">
      <span class="status-tool" id="status-tool">Ready</span>
      <div class="statusbar-spacer"></div>
      <span class="zoom-level" id="status-zoom">100%</span>
    </div>
  </div>

  <div class="context-menu" id="context-menu">
    <button class="context-menu-item" id="ctx-window-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r="1" fill="#ff5f57" stroke="none"/><circle cx="9.5" cy="6.5" r="1" fill="#febc2e" stroke="none"/><circle cx="12.5" cy="6.5" r="1" fill="#28c840" stroke="none"/></svg>
      <span>Window container</span>
      <span class="ctx-shortcut">W</span>
    </button>
    <div class="context-menu-separator"></div>
    <div class="context-menu-label">Background</div>
    <div class="context-menu-gradients" id="ctx-gradients">
      <button class="gradient-swatch" data-gradient="none" title="Landing page"><span style="background:linear-gradient(180deg,#dfc8ac,#d7bea2 60%,#cfb18f)"></span></button>
      <button class="gradient-swatch" data-gradient="sunset" title="Sunset"><span style="background:linear-gradient(135deg,#f97316,#ec4899)"></span></button>
      <button class="gradient-swatch" data-gradient="ocean" title="Ocean"><span style="background:linear-gradient(135deg,#06b6d4,#3b82f6)"></span></button>
      <button class="gradient-swatch" data-gradient="forest" title="Forest"><span style="background:linear-gradient(135deg,#22c55e,#14b8a6)"></span></button>
      <button class="gradient-swatch" data-gradient="purple" title="Purple"><span style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"></span></button>
      <button class="gradient-swatch" data-gradient="midnight" title="Midnight"><span style="background:linear-gradient(135deg,#1e1b4b,#312e81)"></span></button>
      <button class="gradient-swatch" data-gradient="warm" title="Warm"><span style="background:linear-gradient(135deg,#fbbf24,#f97316)"></span></button>
    </div>
    <div class="context-menu-separator"></div>
    <button class="context-menu-item" id="ctx-copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>
      <span>Copy to clipboard</span>
      <span class="ctx-shortcut">Ctrl+C</span>
    </button>
    <button class="context-menu-item" id="ctx-save-png">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M3 17v2a2 2 0 002 2h14a2 2 0 002-2v-2"/></svg>
      <span>Save as PNG</span>
      <span class="ctx-shortcut">Ctrl+E</span>
    </button>
  </div>

  <div class="right-sidebar" id="right-sidebar">
    <button class="rs-item" id="rs-window-container" title="Window container (W)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r="1" fill="#ff5f57" stroke="none"/><circle cx="9.5" cy="6.5" r="1" fill="#febc2e" stroke="none"/><circle cx="12.5" cy="6.5" r="1" fill="#28c840" stroke="none"/></svg>
    </button>
    <div class="rs-separator"></div>
    <div class="rs-gradients" id="rs-gradients">
      <button class="rs-gradient-swatch" data-gradient="none" title="Landing page"><span style="background:linear-gradient(180deg,#dfc8ac,#d7bea2 60%,#cfb18f)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="sunset" title="Sunset"><span style="background:linear-gradient(135deg,#f97316,#ec4899)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="ocean" title="Ocean"><span style="background:linear-gradient(135deg,#06b6d4,#3b82f6)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="forest" title="Forest"><span style="background:linear-gradient(135deg,#22c55e,#14b8a6)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="purple" title="Purple"><span style="background:linear-gradient(135deg,#8b5cf6,#ec4899)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="midnight" title="Midnight"><span style="background:linear-gradient(135deg,#1e1b4b,#312e81)"></span></button>
      <button class="rs-gradient-swatch" data-gradient="warm" title="Warm"><span style="background:linear-gradient(135deg,#fbbf24,#f97316)"></span></button>
    </div>
    <div class="rs-separator"></div>
    <button class="rs-item" id="rs-copy" title="Copy to clipboard (Ctrl+C)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>
    </button>
    <button class="rs-item" id="rs-save-png" title="Save as PNG (Ctrl+E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M3 17v2a2 2 0 002 2h14a2 2 0 002-2v-2"/></svg>
    </button>
  </div>




  <div class="app-tooltip" id="app-tooltip" aria-hidden="true"></div>

  <script src="/src/renderer/web-preview.js"></script>
  <script src="/src/renderer/renderer.js"></script>
  <script type="module" src="/src/react/theme-toggle-mount.tsx"></script>
  <script type="module" src="/src/react/editor-mount.tsx"></script>
</body>
</html>
